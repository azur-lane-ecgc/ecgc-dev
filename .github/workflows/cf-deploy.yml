name: Deploy to Cloudflare Workers

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/web/**"
  #     - "packages/AzurLaneData/**"
  #     # - "wrangler.jsonc"
  #     # - "package.json"
  #     # - ".github/workflows/cf-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: CF-Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT}}

      - parallel:
          - name: Set up Node
            uses: actions/setup-node@v7.1.0
            with:
              node-version: "26.12.1"

          - name: Set up Bun
            uses: oven-sh/setup-bun@v2.2.0
            with:
              bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Astro image cache
        uses: actions/cache@v6.1.0
        with:
          path: apps/web/node_modules/.astro
          key: astro-images-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            astro-images-${{ runner.os }}-

      - name: Compress Build
        run: bun run cf-build

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
